name: CI

on:
    push:
        branches:
            - "*"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.23.4"
            - run: npm i
            - run: npm run build:prod
            - run: npm test

            # Production deployment is now an explicit, serialized image import.
            # Do not restore git-push deployment: it builds on the shared 2 GB host.
